<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700&family=Amiri:wght@400;700&display=swap">
  <style>
    body { margin: 0; background: #f6f9f7; font-family: "Cairo", ui-sans-serif, system-ui, sans-serif; color: #0e1f19; }
    a { color: #1e6e51; text-decoration: none; }
    a:hover { color: #1a5842; }
    .amiri { font-family: "Amiri", ui-serif, Georgia, serif; }
  </style>
</helmet>

<!--
  SIGN IN ON A PHONE — where the header's one button lands.

  Everything the three audiences need is on this single screen: the form for
  a معلمة or مشرفة, staff registration under it, the student tab beside it,
  and the admin line at the bottom. Fields are 52px and the tabs 46px: this
  is typed on a phone, often outdoors, often by someone in a hurry before her
  circle starts.

  No fake status bar - the phone paints the real one over this strip.
-->
<div dir="rtl" style="width: 390px; min-height: 844px; background: #f6f9f7; display: flex; flex-direction: column;">

  <div style="display: flex; align-items: center; gap: 10px; padding: 12px 14px; background: #ffffff; border-bottom: 1px solid #dbe5e0;">
    <a href="#" style="display: inline-flex; align-items: center; justify-content: center; width: 38px; height: 38px; border-radius: 10px; border: 1px solid #dbe5e0; color: #5a6e66; flex-shrink: 0;" aria-label="رجوع">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 18l6-6-6-6"/></svg>
    </a>
    <span style="font-size: 15px; font-weight: 700;">تسجيل الدخول</span>
  </div>

  <div style="display: flex; flex-direction: column; padding: 22px 14px 26px;">

    <div style="display: flex; flex-direction: column; align-items: center; gap: 8px; padding-bottom: 20px;">
      <img src="sohbah-logo.webp" alt="" style="width: 48px; height: 48px; object-fit: contain;">
      <span style="font-size: 13px; color: #5a6e66;">مقراءة صحبة الإلكترونية</span>
    </div>

    <div style="background: #ffffff; border: 1px solid #dbe5e0; border-radius: 16px; overflow: hidden;">

      <div style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 5px; padding: 5px; background: #edf2ef;">
        <button type="button" style="display: inline-flex; align-items: center; justify-content: center; gap: 6px; height: 46px; border: 0; border-radius: 10px; background: #ffffff; color: #0e1f19; font-family: inherit; font-size: 14px; font-weight: 700; box-shadow: 0 1px 2px rgba(14,31,25,0.08); cursor: pointer;">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#1e6e51" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M4 19.5V6a2 2 0 0 1 2-2h13v16H6a2 2 0 0 0-2 1.5z"/><path d="M8 8h7"/></svg>
          معلمة أو مشرفة
        </button>
        <button type="button" style="display: inline-flex; align-items: center; justify-content: center; gap: 6px; height: 46px; border: 0; border-radius: 10px; background: transparent; color: #5a6e66; font-family: inherit; font-size: 14px; font-weight: 600; cursor: pointer;">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg>
          طالبة
        </button>
      </div>

      <div style="padding: 18px 16px 20px;">

        <p style="margin: 0 0 16px; font-size: 12.5px; color: #5a6e66; line-height: 1.7;">
          المعلمات والمشرفات يدخلن من نفس المكان — صلاحيات المشرفة بتتحدد من حسابها.
        </p>

        <div style="display: flex; flex-direction: column; gap: 6px;">
          <label style="font-size: 13px; font-weight: 600;">رقم الهاتف</label>
          <div style="display: flex; align-items: center; gap: 10px; height: 52px; padding: 0 14px; border: 1px solid #dbe5e0; border-radius: 12px;">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#5a6e66" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" style="flex-shrink: 0;"><path d="M22 16.9v3a2 2 0 0 1-2.2 2 19.8 19.8 0 0 1-8.6-3.1 19.5 19.5 0 0 1-6-6A19.8 19.8 0 0 1 2.1 4.2 2 2 0 0 1 4.1 2h3a2 2 0 0 1 2 1.7c.1.9.4 1.8.7 2.7a2 2 0 0 1-.5 2.1L8.1 9.8a16 16 0 0 0 6 6l1.3-1.2a2 2 0 0 1 2.1-.5c.9.3 1.8.6 2.7.7a2 2 0 0 1 1.8 2.1z"/></svg>
            <span dir="ltr" style="font-size: 16px; color: #a7b5ae; flex-grow: 1; text-align: start;">01xxxxxxxxx</span>
          </div>
        </div>

        <div style="display: flex; flex-direction: column; gap: 6px; margin-top: 14px;">
          <label style="font-size: 13px; font-weight: 600;">كلمة المرور</label>
          <div style="display: flex; align-items: center; gap: 10px; height: 52px; padding: 0 14px; border: 1px solid #dbe5e0; border-radius: 12px;">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#5a6e66" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" style="flex-shrink: 0;"><rect x="3" y="11" width="18" height="10" rx="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/></svg>
            <span style="font-size: 17px; color: #a7b5ae; letter-spacing: 0.22em; flex-grow: 1;">••••••••</span>
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#5a6e66" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" style="flex-shrink: 0;"><path d="M2 12s3.6-7 10-7 10 7 10 7-3.6 7-10 7-10-7-10-7z"/><circle cx="12" cy="12" r="3"/></svg>
          </div>
        </div>

        <button type="button" style="display: flex; align-items: center; justify-content: center; width: 100%; height: 52px; margin-top: 20px; border: 0; border-radius: 12px; background: #1e6e51; color: #ffffff; font-family: inherit; font-size: 16px; font-weight: 700; cursor: pointer;">
          دخول
        </button>

        <!-- Staff registration: on the same screen, not another journey. -->
        <a href="#" style="display: flex; align-items: center; justify-content: center; width: 100%; height: 50px; margin-top: 10px; border-radius: 12px; border: 1px solid #a8d9c2; color: #1a5842; font-size: 15px; font-weight: 700;">
          تقديم طلب حساب جديد
        </a>

        <p style="margin: 12px 0 0; font-size: 12px; color: #5a6e66; text-align: center; line-height: 1.65;">
          الحسابات الجديدة تُراجَع من المشرفة قبل تفعيل الدخول.
        </p>
      </div>
    </div>

    <div style="display: flex; align-items: center; justify-content: center; gap: 7px; margin-top: 20px; padding-top: 16px; border-top: 1px solid #dbe5e0;">
      <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="#8b9a93" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/></svg>
      <a href="#" style="font-size: 12.5px; font-weight: 600; color: #8b9a93;">الدخول كأدمن</a>
    </div>

  </div>
</div>
</x-dc>
</body>
</html>
