<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700&family=Amiri:wght@400;700&display=swap">
  <style>
    body { margin: 0; background: #f6f9f7; font-family: "Cairo", ui-sans-serif, system-ui, sans-serif; color: #0e1f19; }
    a { color: #1e6e51; text-decoration: none; }
    a:hover { color: #1a5842; }
    .amiri { font-family: "Amiri", ui-serif, Georgia, serif; }
  </style>
</helmet>

<!--
  SIGN IN — two tabs, not three.

  معلمة and مشرفة sign in through the SAME form (phone + password): the role
  is chosen at REGISTRATION, not at login, so a third tab would ask for the
  same two fields under a different name and teach people that the choice
  matters. The split that is real is: people who sign in, and a student, who
  never does - she registers once and then only ever opens her circle's link.

  Admin is a genuinely different form (email + password), and rare - so it is
  the small line at the bottom, as asked.
-->
<div dir="rtl" style="width: 560px; min-height: 680px; background: #f6f9f7; display: flex; flex-direction: column; align-items: center; padding: 40px 40px 44px;">

  <img src="sohbah-logo.webp" alt="" style="width: 54px; height: 54px; object-fit: contain;">
  <h1 class="amiri" style="margin: 14px 0 0; font-size: 28px; font-weight: 700;">تسجيل الدخول</h1>
  <p style="margin: 6px 0 0; font-size: 15px; color: #5a6e66; text-align: center;">مقراءة صحبة الإلكترونية</p>

  <div style="width: 100%; margin-top: 26px; background: #ffffff; border: 1px solid #dbe5e0; border-radius: 16px; box-shadow: 0 1px 2px rgba(14,31,25,0.05); overflow: hidden;">

    <!-- Segmented tabs. The inactive one is a real affordance, not a ghost. -->
    <div style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 6px; padding: 6px; background: #edf2ef;">
      <button type="button" style="display: inline-flex; align-items: center; justify-content: center; gap: 8px; height: 44px; border: 0; border-radius: 10px; background: #ffffff; color: #0e1f19; font-family: inherit; font-size: 15px; font-weight: 700; box-shadow: 0 1px 2px rgba(14,31,25,0.08); cursor: pointer;">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#1e6e51" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M4 19.5V6a2 2 0 0 1 2-2h13v16H6a2 2 0 0 0-2 1.5z"/><path d="M8 8h7"/></svg>
        معلمة أو مشرفة
      </button>
      <button type="button" style="display: inline-flex; align-items: center; justify-content: center; gap: 8px; height: 44px; border: 0; border-radius: 10px; background: transparent; color: #5a6e66; font-family: inherit; font-size: 15px; font-weight: 600; cursor: pointer;">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg>
        طالبة
      </button>
    </div>

    <div style="padding: 24px;">

      <!-- One form for both roles, said out loud so nobody hunts for a
           "مشرفة" tab that does not exist. -->
      <p style="margin: 0 0 18px; font-size: 13px; color: #5a6e66; line-height: 1.7;">
        المعلمات والمشرفات يدخلن من نفس المكان — صلاحيات المشرفة بتتحدد من حسابها، مش من هنا.
      </p>

      <div style="display: flex; flex-direction: column; gap: 7px;">
        <label style="font-size: 14px; font-weight: 600;">رقم الهاتف</label>
        <div style="display: flex; align-items: center; gap: 10px; height: 48px; padding: 0 14px; border: 1px solid #dbe5e0; border-radius: 12px; background: #ffffff;">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#5a6e66" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M22 16.9v3a2 2 0 0 1-2.2 2 19.8 19.8 0 0 1-8.6-3.1 19.5 19.5 0 0 1-6-6A19.8 19.8 0 0 1 2.1 4.2 2 2 0 0 1 4.1 2h3a2 2 0 0 1 2 1.7c.1.9.4 1.8.7 2.7a2 2 0 0 1-.5 2.1L8.1 9.8a16 16 0 0 0 6 6l1.3-1.2a2 2 0 0 1 2.1-.5c.9.3 1.8.6 2.7.7a2 2 0 0 1 1.8 2.1z"/></svg>
          <span dir="ltr" style="font-size: 15px; color: #a7b5ae; flex-grow: 1; text-align: start;">01xxxxxxxxx</span>
        </div>
      </div>

      <div style="display: flex; flex-direction: column; gap: 7px; margin-top: 16px;">
        <label style="font-size: 14px; font-weight: 600;">كلمة المرور</label>
        <div style="display: flex; align-items: center; gap: 10px; height: 48px; padding: 0 14px; border: 1px solid #dbe5e0; border-radius: 12px; background: #ffffff;">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#5a6e66" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="11" width="18" height="10" rx="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/></svg>
          <span style="font-size: 17px; color: #a7b5ae; letter-spacing: 0.22em; flex-grow: 1;">••••••••</span>
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#5a6e66" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M2 12s3.6-7 10-7 10 7 10 7-3.6 7-10 7-10-7-10-7z"/><circle cx="12" cy="12" r="3"/></svg>
        </div>
      </div>

      <button type="button" style="display: flex; align-items: center; justify-content: center; width: 100%; height: 50px; margin-top: 22px; border: 0; border-radius: 12px; background: #1e6e51; color: #ffffff; font-family: inherit; font-size: 16px; font-weight: 700; cursor: pointer;">
        دخول
      </button>

      <div style="display: flex; align-items: center; justify-content: center; gap: 7px; margin-top: 16px; font-size: 14px; color: #5a6e66;">
        <span>ملكيش حساب؟</span>
        <a href="#" style="font-weight: 700;">تقديم طلب حساب</a>
      </div>
      <p style="margin: 8px 0 0; font-size: 12px; color: #5a6e66; text-align: center; line-height: 1.65;">
        الحسابات الجديدة تُراجَع من المشرفة قبل تفعيل الدخول.
      </p>
    </div>
  </div>

  <!-- Admin: small, and visually separated so it reads as "not for you"
       unless you already know it is. -->
  <div style="display: flex; align-items: center; gap: 7px; margin-top: 22px; padding-top: 18px; border-top: 1px solid #dbe5e0; width: 100%; justify-content: center;">
    <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="#8b9a93" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/></svg>
    <a href="#" style="font-size: 12.5px; font-weight: 600; color: #8b9a93;">الدخول كأدمن</a>
  </div>

</div>
</x-dc>
</body>
</html>
